<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #ntf {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,20,0.9); color: #fff; padding: 15px 24px;
            border-radius: 12px; border: 1px solid #333; z-index: 99;
            display: flex; flex-direction: column; align-items: center; gap: 12px; backdrop-filter: blur(5px);
            text-align: center; max-width: 320px;
        }
        #ntf b { color: #2ecc71; font-size: 16px; }
        #ntf p { margin: 0; color: #aaa; font-size: 13px; line-height: 1.4; }
        #btn { background: #2ecc71; border: none; color: #000; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; }
        #btn:hover { background: #27ae60; }
        .ld { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #444; background: #000; }
    </style>
</head>
<body>

    <div id="ld">Initialising...</div>

    <div id="ntf">
        <b>SyeOS Node Active</b>
        <p>Streamex prevents local frame nesting. Click launch to host the secure viewport.</p>
        <button id="btn" onclick="launchCloakedStream()">Launch Portal</button>
    </div>

    <script>
        document.getElementById('ld').style.display = 'none';

        function launchCloakedStream() {
            const newTab = window.open('about:blank', '_blank');
            
            if (newTab) {
                const d = newTab.document;
                d.body.style.margin = "0";
                d.body.style.padding = "0";
                d.body.style.height = "100vh";
                d.body.style.width = "100vw";
                d.body.style.overflow = "hidden";
                d.body.style.background = "#000";
                
                d.title = "Google Drive"; 

                d.body.innerHTML = `
                    <div id="wrapper" style="width: 100vw; height: 100vh; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; padding: 20px;">
                        <div style="color: #2ecc71; font-weight: bold; font-size: 24px; margin-bottom: 10px;">⚡ Streaming Node</div>
                        <p style="color: #666; font-size: 14px; max-width: 360px; margin: 0 0 24px 0; line-height: 1.6;">
                            Establishing stream pathways. Click below to load content permanently inside this masked context.
                        </p>
                        <button id="loadBtn" style="background: #2ecc71; border: none; color: #000; padding: 12px 32px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s;">
                            Load Platform
                        </button>
                    </div>
                `;

                d.getElementById('loadBtn').onclick = function() {
                    newTab.location.replace("https://streamex.ws/home");
                };
            } else {
                alert("Pop-up engine blocked! Please check browser address bar notification to allow execution.");
            }
        }
    </script>
</body>
</html>
