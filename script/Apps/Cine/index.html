<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #ntf {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,20,0.9); color: #fff; padding: 15px 24px;
            border-radius: 12px; border: 1px solid #333; z-index: 99;
            display: flex; flex-direction: column; align-items: center; gap: 12px; backdrop-filter: blur(5px);
            text-align: center; max-width: 320px;
        }
        #ntf b { color: #2ecc71; font-size: 16px; }
        #ntf p { margin: 0; color: #aaa; font-size: 13px; line-height: 1.4; }
        #btn { background: #2ecc71; border: none; color: #000; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; }
        #btn:hover { background: #27ae60; }
        .ld { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #444; background: #000; }
    </style>
</head>
<body>

    <div id="ld">Initialising...</div>

    <div id="ntf">
        <b>SyeOS Node Active</b>
        <p>Streamex prevents local frame nesting. Click launch to host the secure viewport.</p>
        <button id="btn" onclick="launchCloakedStream()">Launch Portal</button>
    </div>

    <script>
        document.getElementById('ld').style.display = 'none';

        function launchCloakedStream() {
            const newTab = window.open('about:blank', '_blank');
            
            if (newTab) {
                const htmlContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Google Drive</title>
                        <style>
                            html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:sans-serif; }
                            #main { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100vw; height:100vh; text-align:center; color:#fff; }
                            button { background:#2ecc71; border:none; color:#000; padding:12px 32px; border-radius:8px; cursor:pointer; font-size:15px; font-weight:bold; }
                        </style>
                    </head>
                    <body>
                        <div id="main">
                            <h2 style="color:#2ecc71;">⚡ Streaming Node</h2>
                            <p style="color:#666; max-width:360px; margin-bottom:20px;">Host security policies require top-level window execution. Click below to load content.</p>
                            <button onclick="window.location.replace('https://streamex.ws')">Load Platform</button>
                        </div>
                    </body>
                    </html>
                `;

                newTab.document.write(htmlContent);
                newTab.document.close();
            } else {
                alert("Pop-up engine blocked! Please check browser address bar notification to allow execution.");
            }
        }
    </script>
</body>
</html>
